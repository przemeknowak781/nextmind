name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Codzienne odświeżenie terminów z Bazy Usług Rozwojowych.
  # Strona jest statyczna, więc dane z BUR wchodzą do niej w czasie builda —
  # bez tego harmonogramu nowe edycje pojawiłyby się dopiero przy kolejnym pushu.
  schedule:
    - cron: '17 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        env:
          SITE_BASE: /nextmind
          # Klucz generowany w profilu BUR (sekcja "Dostęp do API").
          # Dodaj go w Settings → Secrets and variables → Actions jako BUR_API_KEY.
          # Bez klucza build przechodzi normalnie — synchronizacja jest pomijana,
          # a w UI działa fallback "Zapytaj o termin".
          BUR_API_KEY: ${{ secrets.BUR_API_KEY }}
          BUR_PROVIDER_ID: '199788'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
